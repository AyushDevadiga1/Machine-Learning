<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Least Squares · 3D Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red:    #ff6b6b;
            --blue:   #4ecdc4;
            --yellow: #ffe66d;
            --green:  #2ecc71;
            --bg:     #080c14;
            --panel:  rgba(8,12,20,0.88);
            --border: rgba(255,255,255,0.08);
            --text:   #c8d6e5;
            --dim:    #5f7182;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container.dragging { cursor: none; }

        /* ── Labels ──────────────────────────────────── */
        .label3d {
            position: absolute;
            pointer-events: none;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid currentColor;
            backdrop-filter: blur(8px);
            background: rgba(8,12,20,0.7);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        .label3d.active { opacity: 1; }

        #label-y    { color: var(--red); }
        #label-yhat { color: var(--blue); }
        #label-e    { color: var(--yellow); }
        #label-floor{ color: var(--dim); }

        /* ── Drag hint badge ─────────────────────────── */
        #drag-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(255,107,107,0.12);
            border: 1px solid rgba(255,107,107,0.4);
            color: var(--red);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            padding: 8px 18px;
            border-radius: 100px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #drag-hint.visible { opacity: 1; }
        #drag-hint svg { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

        /* ── Sidebar ─────────────────────────────────── */
        #sidebar {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            width: 340px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-left: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }

        .sidebar-header {
            padding: 28px 24px 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.4;
        }
        .sidebar-header p {
            margin-top: 6px;
            font-size: 12px;
            color: var(--dim);
        }

        /* Step progress */
        .step-track {
            display: flex;
            gap: 6px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
        }
        .step-pip {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            transition: background 0.4s, box-shadow 0.4s;
        }
        .step-pip.done  { background: rgba(255,255,255,0.25); }
        .step-pip.active { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }

        /* Content */
        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: thin;
            scrollbar-color: #1e2d40 transparent;
        }

        .step-title {
            font-family: 'Space Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .step-body p {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 12px;
        }

        .callout {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }
        .callout-red    { background: rgba(255,107,107,0.07); border-color: var(--red); }
        .callout-blue   { background: rgba(78,205,196,0.07);  border-color: var(--blue); }
        .callout-yellow { background: rgba(255,230,109,0.07); border-color: var(--yellow); }
        .callout-green  { background: rgba(46,204,113,0.07);  border-color: var(--green); }

        .callout strong {
            display: block;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .callout-red strong    { color: var(--red); }
        .callout-blue strong   { color: var(--blue); }
        .callout-yellow strong { color: var(--yellow); }
        .callout-green strong  { color: var(--green); }
        .callout p { font-size: 13px; color: var(--text); margin: 0; }

        /* Live metrics */
        #live-metrics {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: none;
            gap: 16px;
            font-family: 'Space Mono', monospace;
        }
        #live-metrics.visible { display: flex; }
        .metric {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .metric-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
        .metric-value { font-size: 16px; font-weight: 700; }
        .metric-value.red    { color: var(--red); }
        .metric-value.blue   { color: var(--blue); }
        .metric-value.yellow { color: var(--yellow); }

        /* Formula table */
        .formula-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 14px;
        }
        .formula-table th {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--dim);
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
        }
        .formula-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text);
        }
        .formula-table td:last-child {
            font-family: 'Space Mono', monospace;
            font-style: italic;
        }

        /* Nav */
        .sidebar-nav {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:not(:disabled):hover { background: rgba(255,255,255,0.1); }
        .btn-primary {
            background: #fff;
            color: #000;
        }
        .btn-primary:not(:disabled):hover { background: rgba(255,255,255,0.88); }
        .btn-restart {
            background: var(--green);
            color: #000;
        }

        /* ── Camera hint ─────────────────────────────── */
        #cam-hint {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 10;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #cam-hint::before {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--dim);
        }

        /* ── Content transition ───────────────────────── */
        #content-area { transition: opacity 0.25s; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="canvas-container"></div>

<!-- Floating Labels -->
<div id="label-y"     class="label3d">y — Actual Data</div>
<div id="label-yhat"  class="label3d">ŷ — Prediction</div>
<div id="label-e"     class="label3d">e — Residual</div>
<div id="label-floor" class="label3d">Col(X) — Feature Space</div>

<!-- Drag hint -->
<div id="drag-hint">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2L12 8M12 8L9 5M12 8L15 5M12 22L12 16M12 16L9 19M12 16L15 19M2 12L8 12M8 12L5 9M8 12L5 15M22 12L16 12M16 12L19 9M16 12L19 15"/>
    </svg>
    DRAG THE RED BALL
</div>

<!-- Sidebar -->
<div id="sidebar">
    <div class="sidebar-header">
        <h1>The Room of<br>Least Squares</h1>
        <p>An interactive geometry of linear regression</p>
    </div>

    <div class="step-track" id="step-track"></div>

    <!-- Live Metrics (shown when ball is draggable) -->
    <div id="live-metrics">
        <div class="metric">
            <span class="metric-label">‖y‖ height</span>
            <span class="metric-value red" id="m-height">7.00</span>
        </div>
        <div class="metric">
            <span class="metric-label">‖e‖ error</span>
            <span class="metric-value yellow" id="m-error">7.00</span>
        </div>
        <div class="metric">
            <span class="metric-label">‖ŷ‖ pred.</span>
            <span class="metric-value blue" id="m-pred">7.07</span>
        </div>
    </div>

    <div id="content-area"></div>

    <div class="sidebar-nav">
        <button id="btn-prev" class="btn btn-ghost" disabled>← Prev</button>
        <button id="btn-next" class="btn btn-primary">Next →</button>
    </div>
</div>

<div id="cam-hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ─────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c14);
scene.fog = new THREE.FogExp2(0x080c14, 0.018);

const camera = new THREE.PerspectiveCamera(42, W()/H(), 0.1, 200);
camera.position.set(16, 11, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2 + 0.15;
controls.target.set(4, 3, 4);

// ── Lights ────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const dirLight = new THREE.DirectionalLight(0x4a6fa5, 0.8);
dirLight.position.set(-15, 20, -10);
scene.add(dirLight);

const spotLight = new THREE.SpotLight(0xffe8a0, 0);
spotLight.position.set(5, 18, 5);
spotLight.angle = Math.PI / 7;
spotLight.penumbra = 0.6;
spotLight.decay = 1.2;
spotLight.distance = 50;
spotLight.castShadow = true;
spotLight.shadow.mapSize.set(2048, 2048);
scene.add(spotLight);

const spotTarget = new THREE.Object3D();
spotTarget.position.set(5, 0, 5);
scene.add(spotTarget);
spotLight.target = spotTarget;

// ── Floor ─────────────────────────────────────────────
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x0d1520, roughness: 0.9, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Fine grid
const grid = new THREE.GridHelper(40, 40, 0x1a2840, 0x111c2e);
grid.position.y = 0.005;
scene.add(grid);

// Coarser accent grid
const grid2 = new THREE.GridHelper(40, 8, 0x1e3050, 0x0d1520);
grid2.position.y = 0.008;
scene.add(grid2);

// Axis arrows
const makeArrow = (dir, color) => new THREE.ArrowHelper(dir, new THREE.Vector3(0,0.02,0), 9, color, 0.6, 0.35);
scene.add(makeArrow(new THREE.Vector3(1,0,0), 0x1e3050));
scene.add(makeArrow(new THREE.Vector3(0,0,1), 0x1e3050));

// ── Core geometry coords ──────────────────────────────
const ORIGIN = new THREE.Vector3(0, 0, 0);
// y starts at (5, 7, 5) — ball position
let yPos = new THREE.Vector3(5, 7, 5);

function getYHatPos(y) {
    // Shadow is projection onto xz-plane (y=0)
    return new THREE.Vector3(y.x, 0, y.z);
}

// ── Ball (y) ──────────────────────────────────────────
const ballGeo = new THREE.SphereGeometry(0.38, 48, 48);
const ballMat = new THREE.MeshStandardMaterial({
    color: 0xff6b6b, emissive: 0x6b0000, roughness: 0.15, metalness: 0.2
});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.copy(yPos);
ball.castShadow = true;
ball.userData.draggable = true;
scene.add(ball);

// Small glow sprite behind ball
const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 128;
const gc = glowCanvas.getContext('2d');
const g = gc.createRadialGradient(64,64,0, 64,64,64);
g.addColorStop(0, 'rgba(255,100,100,0.5)');
g.addColorStop(1, 'rgba(255,100,100,0)');
gc.fillStyle = g;
gc.fillRect(0,0,128,128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowMesh = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false }));
glowMesh.scale.set(3, 3, 1);
ball.add(glowMesh);

// ── Shadow blob (ŷ) ───────────────────────────────────
const shadowMat = new THREE.MeshStandardMaterial({
    color: 0x4ecdc4, emissive: 0x003835, roughness: 0.2, metalness: 0.1,
    transparent: true, opacity: 0
});
const shadowObj = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 48, 48),
    shadowMat
);
shadowObj.position.copy(getYHatPos(yPos));
scene.add(shadowObj);

// Ripple ring on floor under shadow
const ringGeo = new THREE.RingGeometry(0.35, 0.55, 48);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ecdc4, side: THREE.DoubleSide, transparent: true, opacity: 0 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

// ── Arrow helpers — y, ŷ ─────────────────────────────
function makeVectorArrow(color) {
    return new THREE.ArrowHelper(
        new THREE.Vector3(0,1,0), ORIGIN, 1, color, 0.55, 0.28
    );
}

const vectorY    = makeVectorArrow(0xff6b6b);
const vectorYHat = makeVectorArrow(0x4ecdc4);
scene.add(vectorY);
scene.add(vectorYHat);

function setArrowOpacity(arr, v) {
    [arr.line.material, arr.cone.material].forEach(m => { m.transparent = true; m.opacity = v; });
}

function updateArrow(arr, from, to) {
    const dir = new THREE.Vector3().subVectors(to, from);
    const len = dir.length();
    if (len < 0.001) return;
    arr.position.copy(from);
    arr.setDirection(dir.normalize());
    arr.setLength(Math.max(0, len - 0.4), 0.55, 0.28);
}

// ── Residual dashed line ──────────────────────────────
const residualMat = new THREE.LineDashedMaterial({ color: 0xffe66d, dashSize: 0.28, gapSize: 0.18, linewidth: 2, transparent: true, opacity: 0 });
let residualLine = null;

function updateResidualLine() {
    if (residualLine) { scene.remove(residualLine); residualLine.geometry.dispose(); }
    const yh = getYHatPos(yPos);
    const geo = new THREE.BufferGeometry().setFromPoints([yPos, yh]);
    residualLine = new THREE.Line(geo, residualMat);
    residualLine.computeLineDistances();
    scene.add(residualLine);
}
updateResidualLine();

// ── Right-angle marker ────────────────────────────────
const rightAngleMat = new THREE.LineBasicMaterial({ color: 0x2ecc71, linewidth: 2, transparent: true, opacity: 0 });
let rightAngleLine = null;

function updateRightAngle() {
    if (rightAngleLine) { scene.remove(rightAngleLine); rightAngleLine.geometry.dispose(); }
    const yh = getYHatPos(yPos);
    const sz = 0.7;
    const toOrigin = new THREE.Vector3().subVectors(ORIGIN, yh).normalize();
    const p1 = new THREE.Vector3(yh.x, sz, yh.z);
    const p2 = new THREE.Vector3(yh.x + toOrigin.x*sz, sz, yh.z + toOrigin.z*sz);
    const p3 = new THREE.Vector3(yh.x + toOrigin.x*sz, 0.02, yh.z + toOrigin.z*sz);
    rightAngleLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p2, p3]), rightAngleMat);
    scene.add(rightAngleLine);
}
updateRightAngle();

// ── Spotlight beam cone (visual) ──────────────────────
const beamGeo = new THREE.CylinderGeometry(0.05, 1.8, 18, 32, 1, true);
const beamMat = new THREE.MeshBasicMaterial({ color: 0xffe8a0, transparent: true, opacity: 0, side: THREE.BackSide });
const beamMesh = new THREE.Mesh(beamGeo, beamMat);
beamMesh.position.set(5, 18 - 9, 5);
scene.add(beamMesh);

// ── Update all geometry when yPos changes ─────────────
function updateGeometry() {
    const yh = getYHatPos(yPos);

    ball.position.copy(yPos);

    shadowObj.position.copy(yh);
    ring.position.set(yh.x, 0.01, yh.z);

    updateArrow(vectorY,    ORIGIN, yPos);
    updateArrow(vectorYHat, ORIGIN, yh);
    updateResidualLine();
    updateRightAngle();

    // Update spotlight target to follow ball shadow
    spotTarget.position.set(yh.x, 0, yh.z);
    spotLight.position.set(yh.x, 18, yh.z);
    beamMesh.position.set(yh.x, 18 - 9, yh.z);

    // Live metrics
    const err = yPos.y;  // since yHat is on floor
    const predLen = yh.length();
    document.getElementById('m-height').textContent = yPos.y.toFixed(2);
    document.getElementById('m-error').textContent  = err.toFixed(2);
    document.getElementById('m-pred').textContent   = predLen.toFixed(2);
}

// ── Drag logic ────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse2d = new THREE.Vector2();
let isDraggingBall = false;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 0), 0); // horizontal at ball height
const dragIntersect = new THREE.Vector3();

function onPointerDown(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse2d.set(
        ((e.clientX - rect.left) / rect.width)  * 2 - 1,
        -((e.clientY - rect.top)  / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(mouse2d, camera);
    const hits = raycaster.intersectObject(ball);
    if (hits.length > 0 && ballDraggable) {
        isDraggingBall = true;
        controls.enabled = false;
        container.classList.add('dragging');
        dragPlane.normal.copy(camera.position).normalize();
        dragPlane.constant = -yPos.dot(dragPlane.normal);
    }
}

function onPointerMove(e) {
    if (!isDraggingBall) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse2d.set(
        ((e.clientX - rect.left) / rect.width)  * 2 - 1,
        -((e.clientY - rect.top)  / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(mouse2d, camera);
    if (raycaster.ray.intersectPlane(dragPlane, dragIntersect)) {
        // Keep x,z free but clamp y above floor
        yPos.x = dragIntersect.x;
        yPos.z = dragIntersect.z;
        yPos.y = Math.max(0.5, dragIntersect.y);
        updateGeometry();
    }
}

function onPointerUp() {
    if (isDraggingBall) {
        isDraggingBall = false;
        controls.enabled = true;
        container.classList.remove('dragging');
    }
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);

// ── Visibility helpers ────────────────────────────────
function setOpacity(mat, v) {
    if (!mat) return;
    if (Array.isArray(mat)) { mat.forEach(m => setOpacity(m, v)); return; }
    mat.transparent = true;
    mat.opacity = THREE.MathUtils.lerp(mat.opacity, v, 0.08);
}

// ── Steps / States ────────────────────────────────────
let currentStep = 0;
let ballDraggable = false;

const steps = [
    {
        title: "The Floor",
        body: `
            <div class="step-body">
                <p>Imagine you're standing in a room. The gridded floor below represents <strong style="color:#fff">every possible prediction</strong> your regression model can make.</p>
                <div class="callout callout-blue">
                    <strong>Col(X) — Feature Space</strong>
                    <p>Your model only has certain features (columns of X). This constrains you to a flat surface — you can slide anywhere on the floor, but you cannot fly.</p>
                </div>
                <p style="font-size:13px; color:var(--dim);">Rotate the camera to get a feel for the space.</p>
            </div>`,
        labels: ['label-floor'],
        showBall: false, showShadow: false, showVectorY: false,
        showVectorYHat: false, showResidual: false, showAngle: false,
        spotlight: 0, draggable: false,
        camPos: new THREE.Vector3(16, 11, 16), camTarget: new THREE.Vector3(3, 0, 3)
    },
    {
        title: "The Floating Ball",
        body: `
            <div class="step-body">
                <p>Now look up. A point hovers <em>above</em> the floor — your actual observed data, <strong style="color:var(--red)">y</strong>.</p>
                <div class="callout callout-red">
                    <strong>y — The Truth</strong>
                    <p>Real-world data floats in mid-air because your features don't explain <em>everything</em>. There's always noise, complexity, variables you didn't measure.</p>
                </div>
            </div>`,
        labels: ['label-floor', 'label-y'],
        showBall: true, showShadow: false, showVectorY: true,
        showVectorYHat: false, showResidual: false, showAngle: false,
        spotlight: 0, draggable: false,
        camPos: new THREE.Vector3(13, 7, 15), camTarget: new THREE.Vector3(4, 3, 4)
    },
    {
        title: "The Shadow & The String",
        body: `
            <div class="step-body">
                <p>Shine a flashlight straight down from above. The <strong style="color:var(--blue)">shadow</strong> it casts is your model's best prediction.</p>
                <div class="callout callout-blue">
                    <strong>ŷ — The Prediction</strong>
                    <p>The orthogonal projection of <em>y</em> onto the floor. This is the point on Col(X) closest to the truth.</p>
                </div>
                <div class="callout callout-yellow">
                    <strong>e — The Residual</strong>
                    <p>The string dangling from ball to shadow is the error — the gap your model cannot close, no matter how hard it tries.</p>
                </div>
            </div>`,
        labels: ['label-y', 'label-yhat', 'label-e'],
        showBall: true, showShadow: true, showVectorY: true,
        showVectorYHat: true, showResidual: true, showAngle: false,
        spotlight: 90, draggable: false,
        camPos: new THREE.Vector3(12, 18, 6), camTarget: new THREE.Vector3(5, 0, 5)
    },
    {
        title: "The 90° Secret",
        body: `
            <div class="step-body">
                <p>Look at where the string meets the carpet. It lands at <strong style="color:var(--green)">exactly 90°</strong>.</p>
                <div class="callout callout-green">
                    <strong>Orthogonality = Minimum Error</strong>
                    <p>If the string were tilted at all, it would be <em>longer</em>. A perpendicular drop is mathematically the shortest possible path — this is why least squares works.</p>
                </div>
                <p style="font-size:13px; line-height:1.6; color:var(--text)">
                    In matrix terms: <code style="background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:4px; font-family:Space Mono,monospace">X<sup>T</sup>e = 0</code><br>
                    <span style="color:var(--dim); font-size:12px">The error is orthogonal to every column of X.</span>
                </p>
            </div>`,
        labels: ['label-yhat', 'label-e'],
        showBall: true, showShadow: true, showVectorY: true,
        showVectorYHat: true, showResidual: true, showAngle: true,
        spotlight: 70, draggable: false,
        camPos: new THREE.Vector3(10, 2, -1), camTarget: new THREE.Vector3(4, 2, 4)
    },
    {
        title: "Drag the Ball",
        body: `
            <div class="step-body">
                <p><strong style="color:var(--red)">Grab the red ball and drag it</strong> — watch how the shadow, string, and metrics update live.</p>
                <p style="font-size:13px; color:var(--dim)">No matter where you move the ball, the string always drops straight down at 90°. The shadow is always the nearest point on the floor.</p>
                <div class="callout callout-yellow">
                    <strong>Intuition check</strong>
                    <p>Higher ball = longer string = larger residual. More features (bigger floor) = shadow moves further from origin = better prediction.</p>
                </div>
            </div>`,
        labels: ['label-y', 'label-yhat', 'label-e'],
        showBall: true, showShadow: true, showVectorY: true,
        showVectorYHat: true, showResidual: true, showAngle: true,
        spotlight: 70, draggable: true,
        camPos: new THREE.Vector3(14, 10, 14), camTarget: new THREE.Vector3(4, 3, 4)
    },
    {
        title: "The Full Picture",
        body: `
            <div class="step-body">
                <p>Least Squares finds the <strong style="color:#fff">unique shadow</strong> — the projection — that minimises the length of the string. Nothing else can do better.</p>
                <table class="formula-table">
                    <tr><th>Room Object</th><th>Math</th></tr>
                    <tr><td style="color:var(--dim)">The Floor</td><td>Col(X)</td></tr>
                    <tr><td style="color:var(--red)">Floating Ball</td><td>y</td></tr>
                    <tr><td style="color:var(--blue)">Shadow</td><td>ŷ = X(X'X)⁻¹X'y</td></tr>
                    <tr><td style="color:var(--yellow)">String</td><td>e = y − ŷ</td></tr>
                    <tr><td style="color:var(--green)">90° Corner</td><td>X'e = 0</td></tr>
                </table>
            </div>`,
        labels: ['label-y', 'label-yhat', 'label-e', 'label-floor'],
        showBall: true, showShadow: true, showVectorY: true,
        showVectorYHat: true, showResidual: true, showAngle: true,
        spotlight: 60, draggable: false,
        camPos: new THREE.Vector3(18, 12, 14), camTarget: new THREE.Vector3(3, 3, 3)
    }
];

// ── Camera lerp targets ───────────────────────────────
let tCamPos    = camera.position.clone();
let tCamTarget = controls.target.clone();

// ── UI ────────────────────────────────────────────────
const stepTrack  = document.getElementById('step-track');
const contentEl  = document.getElementById('content-area');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const liveMetrics = document.getElementById('live-metrics');
const dragHint   = document.getElementById('drag-hint');

steps.forEach(() => {
    const pip = document.createElement('div');
    pip.className = 'step-pip';
    stepTrack.appendChild(pip);
});

function renderStep(idx) {
    const s = steps[idx];

    // Camera
    tCamPos.copy(s.camPos);
    tCamTarget.copy(s.camTarget);

    // Draggable
    ballDraggable = s.draggable;

    // Live metrics
    if (s.draggable) {
        liveMetrics.classList.add('visible');
        dragHint.classList.add('visible');
    } else {
        liveMetrics.classList.remove('visible');
        dragHint.classList.remove('visible');
    }

    // Pips
    Array.from(stepTrack.children).forEach((pip, i) => {
        pip.className = 'step-pip' + (i < idx ? ' done' : '') + (i === idx ? ' active' : '');
    });

    // Buttons
    btnPrev.disabled = idx === 0;
    const isLast = idx === steps.length - 1;
    btnNext.textContent = isLast ? '↺ Restart' : 'Next →';
    btnNext.className = isLast ? 'btn btn-restart' : 'btn btn-primary';

    // Content
    contentEl.style.opacity = '0';
    setTimeout(() => {
        contentEl.innerHTML = `<h2 class="step-title">${s.title}</h2>${s.body}`;
        contentEl.style.opacity = '1';
    }, 200);

    // Labels
    ['label-y','label-yhat','label-e','label-floor'].forEach(id => {
        document.getElementById(id).classList.toggle('active', s.labels.includes(id));
    });
}

btnPrev.addEventListener('click', () => {
    if (currentStep > 0) { currentStep--; renderStep(currentStep); }
});
btnNext.addEventListener('click', () => {
    currentStep = (currentStep < steps.length - 1) ? currentStep + 1 : 0;
    renderStep(currentStep);
});

// ── Label positioning ─────────────────────────────────
function projectLabel(worldPos, el) {
    const v = worldPos.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * W();
    const y = (-v.y * 0.5 + 0.5) * H();
    if (v.z > 1) { el.style.opacity = '0'; return; }
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.transform = 'translate(-50%, -60%)';
}

// ── Render loop ───────────────────────────────────────
const clock = new THREE.Clock();
let bobOffset = 0;

function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    const s = steps[currentStep];

    // Camera lerp
    camera.position.lerp(tCamPos, 0.035);
    controls.target.lerp(tCamTarget, 0.045);
    controls.update();

    // Bob the ball if not dragging and appropriate step
    if (!isDraggingBall && s.showBall && !s.draggable && currentStep <= 1) {
        bobOffset += dt * 1.8;
        yPos.y = 7 + Math.sin(bobOffset) * 0.12;
        updateGeometry();
    }

    // Spotlight intensity lerp
    spotLight.intensity += (s.spotlight - spotLight.intensity) * 0.05;
    beamMat.opacity = THREE.MathUtils.lerp(beamMat.opacity, s.spotlight > 0 ? 0.04 : 0, 0.05);

    // Ring pulse
    const ringPulse = s.spotlight > 0 ? (0.4 + Math.sin(Date.now()*0.003) * 0.15) : 0;
    ringMat.opacity = THREE.MathUtils.lerp(ringMat.opacity, ringPulse, 0.06);

    // Object fades
    ballMat.opacity = THREE.MathUtils.lerp(ballMat.opacity ?? 1, s.showBall ? 1 : 0, 0.08);
    ball.visible = ballMat.opacity > 0.01;
    glowMesh.material.opacity = ballMat.opacity;

    shadowMat.opacity = THREE.MathUtils.lerp(shadowMat.opacity, s.showShadow ? 1 : 0, 0.08);
    shadowObj.visible = shadowMat.opacity > 0.01;

    const rOpacity = s.showResidual ? 1 : 0;
    residualMat.opacity = THREE.MathUtils.lerp(residualMat.opacity, rOpacity, 0.08);
    if (residualLine) residualLine.visible = residualMat.opacity > 0.01;

    const aOpacity = s.showAngle ? 1 : 0;
    rightAngleMat.opacity = THREE.MathUtils.lerp(rightAngleMat.opacity, aOpacity, 0.08);
    if (rightAngleLine) rightAngleLine.visible = rightAngleMat.opacity > 0.01;

    setArrowOpacity(vectorY,    s.showVectorY    ? 1 : 0);
    setArrowOpacity(vectorYHat, s.showVectorYHat ? 1 : 0);

    // Labels
    if (s.labels.includes('label-y'))     projectLabel(yPos, document.getElementById('label-y'));
    if (s.labels.includes('label-yhat'))  projectLabel(getYHatPos(yPos), document.getElementById('label-yhat'));
    if (s.labels.includes('label-e'))     projectLabel(new THREE.Vector3().lerpVectors(yPos, getYHatPos(yPos), 0.5), document.getElementById('label-e'));
    if (s.labels.includes('label-floor')) projectLabel(new THREE.Vector3(6, 0, -2), document.getElementById('label-floor'));

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = W() / H();
    camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
});

// Kick off
// Force ball mat opacity controllable
ballMat.transparent = true;
ballMat.opacity = 0;
updateGeometry();
renderStep(0);
animate();
</script>
</body>
</html>
